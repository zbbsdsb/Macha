# Gradle 配置
# org.gradle.daemon=false 是刻意选择（F3）：本机是"跑一次就退"的受控 VM，
# 关闭 daemon 避免残留守护进程在长离线环境下复用旧类路径造成不可复现；代价是每次构建启动稍慢，可接受。
org.gradle.daemon=false
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m
# 告警等级：把 Kotlin/依赖弃用等告警打全，便于尽早发现版本/配置漂移。
# 说明：这是 warning 级别，【不是】dependency verification / lockfile。03 §2 要求的依赖校验与
# lockfile 因本机 VM 连不上 services.gradle.org、无法安全生成锁文件，暂未启用（如实，不冒充"已校验"）。
# 待解锁网络或进入联网 CI 后补：gradle --write-verification-metadata sha256 生成 verification-metadata.xml。
# 当前离线可复现依赖：version catalog 全量锁定 + 依赖坐标已在本地 Gradle 缓存 + 构建根与仓库上级隔离。
org.gradle.warning.mode=all
# Kotlin 官方推荐代码风格（官方 code style，与"单元测试"无关）
kotlin.code.style=official