# 所有版本的唯一来源。任何版本不得散落在 build.gradle.kts 里。
# 坐标经 2026-09-14 实测 Maven 元数据校准；版本依据 research/plans/minecraft-layer/00 §C.1。

[versions]
java = "25"
kotlin = "2.4.20"
gradle = "9.7.1"

minecraft = "26.2"
paper = "26.2.build.123-stable"
paperApi = "26.2.build.123-stable"

kotlinxSerialization = "1.11.0"
javaWebsocket = "1.6.0"
junit = "5.11.4"
shadow = "9.6.1"
foojay = "1.0.0"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paperApi" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
java-websocket = { module = "org.java-websocket:Java-WebSocket", version.ref = "javaWebsocket" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }